name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APKs & App Bundle
      run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

    - name: Collect Release Artifacts
      run: |
        mkdir -p release-artifacts
        cp app/build/outputs/apk/debug/*.apk release-artifacts/ 2>/dev/null || true
        cp app/build/outputs/apk/release/*.apk release-artifacts/ 2>/dev/null || true
        cp app/build/outputs/bundle/release/*.aab release-artifacts/ 2>/dev/null || true
        ls -la release-artifacts/

    - name: Upload APK & Bundle Artifacts (Actions)
      uses: actions/upload-artifact@v4
      with:
        name: iManage-Files-Artifacts
        path: release-artifacts/*

    - name: Create GitHub Release (On Tag or Manual)
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*
        name: "iManage Files ${{ github.ref_name }}"
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
