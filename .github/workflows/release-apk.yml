name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Repository secrets: VAJRAFS_KEYSTORE_BASE64 (base64 of the upload .jks),
    # VAJRAFS_KEYSTORE_PASSWORD, VAJRAFS_KEY_ALIAS, VAJRAFS_KEY_PASSWORD.
    - name: Restore upload keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.VAJRAFS_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::VAJRAFS_KEYSTORE_BASE64 is not set; refusing to publish an unsigned release."
            exit 1
          fi
          echo "::warning::No signing secrets; release artifacts will be unsigned."
          exit 0
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vajrafs-upload.jks"
        echo "VAJRAFS_KEYSTORE_PATH=$RUNNER_TEMP/vajrafs-upload.jks" >> "$GITHUB_ENV"

    # github flavor: sideload APK with the in-app updater.
    # play flavor:   App Bundle for Google Play, no self-update code.
    - name: Build APKs & App Bundle
      env:
        VAJRAFS_KEYSTORE_PASSWORD: ${{ secrets.VAJRAFS_KEYSTORE_PASSWORD }}
        VAJRAFS_KEY_ALIAS: ${{ secrets.VAJRAFS_KEY_ALIAS }}
        VAJRAFS_KEY_PASSWORD: ${{ secrets.VAJRAFS_KEY_PASSWORD }}
      run: ./gradlew testGithubDebugUnitTest assembleGithubDebug assembleGithubRelease bundlePlayRelease --stacktrace

    - name: Collect Release Artifacts
      run: |
        mkdir -p release-artifacts
        cp app/build/outputs/apk/github/debug/*.apk release-artifacts/ 2>/dev/null || true
        cp app/build/outputs/apk/github/release/*.apk release-artifacts/ 2>/dev/null || true
        cp app/build/outputs/bundle/playRelease/*.aab release-artifacts/ 2>/dev/null || true
        ls -la release-artifacts/

    - name: Upload APK & Bundle Artifacts (Actions)
      uses: actions/upload-artifact@v4
      with:
        name: VajraFS-Artifacts
        path: release-artifacts/*

    # The .aab is attached for convenience; upload it to Play Console by hand (or via fastlane supply).
    - name: Create GitHub Release (On Tag or Manual)
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*
        name: "VajraFS ${{ github.ref_name }}"
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
